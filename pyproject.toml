[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sdkmgr"
dynamic = ["version"]
description = "Discover and provision Node, Java, and Android development tools."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Lex Berezhny", email = "lex@damoti.com"}]
keywords = ["sdk", "node", "java", "android", "toolchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["filelock>=3.16", "httpx>=0.27,<1", "platformdirs>=4"]

[project.urls]
Homepage = "https://github.com/pyjs/sdkmgr"
"Release notes" = "https://github.com/pyjs/sdkmgr/releases"
Source = "https://github.com/pyjs/sdkmgr"
Tracker = "https://github.com/pyjs/sdkmgr/issues"
Discord = "https://discord.gg/YktKpQPG7"
X = "https://x.com/pyjsdev"

[project.scripts]
sdkmgr = "sdkmgr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["sdkmgr"]

[tool.hatch.version]
path = "sdkmgr/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/sdkmgr", "/tests", "/scripts", "/README.md", "/CHANGELOG.md",
    "/LICENSE", "/pyproject.toml", "/uv.lock",
]
