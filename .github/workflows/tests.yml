name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run python scripts/check_release.py

  node-provider:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {os: ubuntu-latest, provider: mise}
          - {os: macos-latest, provider: mise}
          - {os: windows-latest, provider: mise}
          - {os: ubuntu-latest, provider: nvm}
          - {os: macos-latest, provider: nvm}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - if: matrix.provider == 'nvm'
        shell: bash
        run: |
          git clone --depth 1 --branch v0.40.3 \
            https://github.com/nvm-sh/nvm.git "$RUNNER_TEMP/sdkmgr-nvm"
          echo "NVM_DIR=$RUNNER_TEMP/sdkmgr-nvm" >> "$GITHUB_ENV"
      - run: uv run python scripts/smoke_node.py ${{ matrix.provider }}

  tool-provider:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python scripts/smoke_tools.py clang
      - run: uv run python scripts/smoke_tools.py tailwindcss
      - if: runner.os == 'Linux'
        run: uv run python scripts/smoke_browser.py --browser-argument=--no-sandbox
      - if: runner.os != 'Linux'
        run: uv run python scripts/smoke_browser.py
